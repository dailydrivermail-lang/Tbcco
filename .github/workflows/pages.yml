# Publishes the Exit Eight website preview at the root and the console demo (fictional data) under /demo/.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish website and demo to GitHub Pages

on:
  push:
    branches: [main, claude/trade-compliance-service-9jnkng]
    paths: ["website/**", "marketing/**", "portal/**", "engine/**", "examples/**", "deploy/**", "rules/**", "templates/**", "intake/**", "swms/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the Exit Eight website (preview, not indexed) at the site root
        run: python website/build.py --out _site --noindex
      - name: Build the internal console demo under /demo/
        run: python deploy/build_static_demo.py --base "${{ steps.pages.outputs.base_path }}/demo/" --out _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
