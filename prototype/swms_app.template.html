<title>SWMS Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a phone-first chat column; on wide screens a job risk profile sits beside it. */
:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #f8fafc; --line: #dfe4ec; --line-strong: #c8d0dc;
  --text: #101828; --text-2: #475467; --text-3: #667085;
  --ink: #0c1a2e; --ink-text: #dbe6ff;
  --primary: #1f56d8; --primary-hover: #1a45b0; --primary-soft: #eef4ff; --primary-line: #c9dafd; --on-primary: #ffffff;
  --ok: #067647; --ok-soft: #ecfdf3; --ok-line: #c6f1d6;
  --warn: #b54708; --warn-soft: #fffaeb; --warn-line: #fde3a7; --warn-strong: #f79009;
  --bad: #b42318; --bad-soft: #fef3f2; --bad-line: #fdd0cc;
  --x: #b42318; --h: #c4500a; --m: #a16207; --l: #067647;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 16px -8px rgba(16, 24, 40, .14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b111b; --surface: #131b28; --surface-2: #0f1622; --line: #243247; --line-strong: #31425c;
  --text: #e8edf5; --text-2: #a9b5c7; --text-3: #8391a7; --ink: #070d16; --ink-text: #dbe6ff;
  --primary: #4b83f5; --primary-hover: #6a99f7; --primary-soft: #16264a; --primary-line: #26427c; --on-primary: #ffffff;
  --ok: #6ce0a0; --ok-soft: #0f2a1e; --ok-line: #1c4a34; --warn: #fbc571; --warn-soft: #2c210c; --warn-line: #5a4312; --warn-strong: #f5a742;
  --bad: #fda29b; --bad-soft: #311513; --bad-line: #5c2622; --x: #fda29b; --h: #fdb27a; --m: #f6d365; --l: #6ce0a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b111b; --surface: #131b28; --surface-2: #0f1622; --line: #243247; --line-strong: #31425c;
  --text: #e8edf5; --text-2: #a9b5c7; --text-3: #8391a7; --ink: #070d16; --ink-text: #dbe6ff;
  --primary: #4b83f5; --primary-hover: #6a99f7; --primary-soft: #16264a; --primary-line: #26427c; --on-primary: #ffffff;
  --ok: #6ce0a0; --ok-soft: #0f2a1e; --ok-line: #1c4a34; --warn: #fbc571; --warn-soft: #2c210c; --warn-line: #5a4312; --warn-strong: #f5a742;
  --bad: #fda29b; --bad-soft: #311513; --bad-line: #5c2622; --x: #fda29b; --h: #fdb27a; --m: #f6d365; --l: #6ce0a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; border-radius: 6px; }
.icon { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; }

.app { height: 100%; display: flex; flex-direction: column; }
.bar { background: var(--ink); color: #fff; }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(140deg, #3c7bff, #1b49c2); color: #fff; }
.bar strong { font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
.bar small { display: block; color: #8fa3c2; font-size: .72rem; font-weight: 500; }
.bar .grow { flex: 1; min-width: 0; }
.bar strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .bar small { display: none; } }
.tag { font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: #1c3257; color: var(--ink-text); white-space: nowrap; }
.tag.on { background: #0f3d2a; color: #8fe3b4; }
.ghost { background: transparent; border: 1px solid #2a3f63; color: var(--ink-text); border-radius: 8px; padding: 6px 10px; font-size: .8rem; font-weight: 600; cursor: pointer; }
.ghost:hover { background: #13243d; }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1120px; width: 100%; margin: 0 auto; }
.chat { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.strip { display: none; }
.thread { flex: 1; min-height: 0; overflow-y: auto; padding-block: 18px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.side { display: none; }
@media (min-width: 1000px) {
  .chat { display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: minmax(0, 1fr) auto; column-gap: 20px; }
  .thread { grid-column: 1; grid-row: 1; } .composer { grid-column: 1; grid-row: 2; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  .side { display: block; grid-column: 2; grid-row: 1 / 3; min-height: 0; overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px 0; }
}
@media (max-width: 999px) {
  .strip { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: .82rem; color: var(--text-2); cursor: pointer; text-align: left; }
  .strip .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .chev { transition: transform .15s; } .strip[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .side.open { display: block; border-bottom: 1px solid var(--line); background: var(--bg); max-height: 46vh; overflow-y: auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

.msg { max-width: min(640px, 92%); display: grid; gap: 8px; animation: rise .18s ease-out; }
.msg.bot { align-self: flex-start; } .msg.me { align-self: flex-end; }
.bubble { padding: 11px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
.me .bubble { background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 6px; }
.bubble.key { border-color: var(--warn-strong); box-shadow: 0 0 0 1px var(--warn-strong), var(--shadow); }
.bubble .q { font-weight: 600; font-size: 1.02rem; line-height: 1.35; }
.kicker { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 600; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line); padding: 2px 8px; border-radius: 99px; margin-bottom: 6px; }
.kicker.plain { color: var(--text-3); background: var(--surface-2); border-color: var(--line); }
.why { margin-top: 8px; font-size: .88rem; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 10px; padding: 8px 10px; }
.hint { font-size: .8rem; color: var(--text-3); }
.reasons { margin: 6px 0 0; padding-left: 18px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 9px 13px; font-weight: 500; cursor: pointer; text-align: left; min-height: 42px; display: inline-flex; align-items: center; gap: 8px; }
.chip:hover:not([disabled]) { border-color: var(--primary); background: var(--primary-soft); }
.chip.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
.chip.unsure { border-style: dashed; color: var(--text-2); }
.chip[disabled] { opacity: .5; cursor: default; }
.chip small { color: var(--warn); font-weight: 600; font-size: .72rem; }
.chip.go { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
.chip.go:hover:not([disabled]) { background: var(--primary-hover); }
.chip.block { display: flex; width: 100%; }
.chip .sub { display: block; font-weight: 400; font-size: .8rem; color: var(--text-3); }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: blink 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.card h3 { font-size: .95rem; font-weight: 650; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .pad { padding: 12px 14px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: .92rem; }
.row:first-of-type { border-top: 0; }
.row .k { color: var(--text-2); min-width: 0; } .row .v { font-weight: 600; text-align: right; }
.row.keyrow .k { color: var(--text); font-weight: 600; }
.row button.link { border: 0; background: none; color: var(--primary); font-weight: 600; cursor: pointer; padding: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-weight: 600; font-size: .8rem; color: var(--text-2); cursor: pointer; }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.seg button.on.no { background: var(--bad); color: var(--surface); } .seg button.on.unsure { background: var(--warn-strong); color: #1b1300; }
.person { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.person.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
.person strong { display: block; font-weight: 600; } .person span.r { font-size: .82rem; color: var(--text-2); }
.box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: transparent; flex: none; margin-top: 2px; }
.on > .box { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 500; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); }
.pill.ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.pill.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.pill.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.note { display: flex; gap: 8px; padding: 10px 12px; border-radius: 10px; font-size: .9rem; border: 1px solid var(--line); }
.note.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.note.ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--primary-soft); border: 1px solid var(--primary-line); border-radius: 10px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }

.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.profile header { padding: 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.eyebrow { display: block; font-size: .68rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.profile section { padding: 12px 14px; border-top: 1px solid var(--line); }
.profile section:first-of-type { border-top: 0; }
.profile ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; font-size: .86rem; }
.profile li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.profile li .icon { margin-top: 3px; width: 15px; height: 15px; }
.profile .p-risk .icon { color: var(--warn-strong); } .profile .p-todo .icon { color: var(--warn-strong); } .profile .p-stop { color: var(--bad); }
.profile .p-need .icon { color: var(--text-3); }
.profile li.new { animation: flash 1.4s ease-out; border-radius: 6px; }
.profile p.empty { font-size: .86rem; color: var(--text-3); margin-top: 4px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer form { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line-strong); border-radius: 14px; padding: 10px 14px; background: var(--surface-2); max-height: 120px; }
.composer textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent); }
.round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.round.send { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.round.live { background: var(--bad); border-color: var(--bad); color: var(--surface); animation: pulse 1.2s infinite; }
.round[disabled] { opacity: .5; cursor: default; }
.composer .hint { margin-top: 6px; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.sheet .draft { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--warn-line); padding: 8px 14px; font-size: .82rem; font-weight: 600; }
.sheet h2 { font-size: 1.1rem; padding: 14px 14px 2px; } .sheet .meta { padding: 0 14px 12px; color: var(--text-2); font-size: .88rem; }
.sheet h4 { margin: 0; padding: 10px 14px 6px; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); border-top: 1px solid var(--line); }
.sheet .list { padding: 0 14px 12px; font-size: .9rem; } .sheet .list ul { margin: 0; padding-left: 18px; }
.step { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px; }
.step .top { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.step .n { font-weight: 700; color: var(--text-3); margin-right: 6px; font-variant-numeric: tabular-nums; }
.step .name { font-weight: 600; }
.risk { font-size: .72rem; font-weight: 700; white-space: nowrap; }
.risk.X { color: var(--x); } .risk.H { color: var(--h); } .risk.M { color: var(--m); } .risk.L { color: var(--l); }
.step .hz { font-size: .84rem; color: var(--text-2); }
.step ul { margin: 0; padding-left: 18px; font-size: .88rem; display: grid; gap: 3px; }
.step li b { font-weight: 600; } .step li.site { color: var(--primary); font-weight: 500; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes flash { from { background: var(--warn-line); } to { background: transparent; } }
@keyframes pulse { 50% { opacity: .65; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="app">
  <div class="bar"><div class="bar-in">
    <span class="mark"><svg class="icon"><use href="#i-shield"/></svg></span>
    <div class="grow"><strong>SWMS Assistant</strong><small>Tell us the job. Find out if it needs a SWMS.</small></div>
    <span class="tag" id="ai-tag">Prototype</span>
    <button class="ghost" id="restart" type="button">Start again</button>
  </div></div>
  <div class="body">
    <div class="chat">
      <button class="strip" id="strip" type="button" aria-expanded="false" aria-controls="side"><svg class="icon"><use href="#i-plain-shield"/></svg><span class="grow" id="strip-text">Job risk profile</span><svg class="icon chev"><use href="#i-down"/></svg></button>
      <aside class="side" id="side" aria-label="Job risk profile"></aside>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="composer">
        <form id="form">
          <textarea id="input" rows="1" aria-label="Message" placeholder="Describe the job in your own words"></textarea>
          <button class="round" id="mic" type="button" aria-label="Speak" hidden><svg class="icon"><use href="#i-mic"/></svg></button>
          <button class="round send" id="send" aria-label="Send"><svg class="icon"><use href="#i-send"/></svg></button>
        </form>
        <p class="hint" id="composer-hint">Prototype with a made-up crew. Nothing is sent or saved.</p>
      </div>
    </div>
  </div>
</div>
