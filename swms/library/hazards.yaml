# SWMS hazard modules: plumbing, ACT + NSW.  v1 (not yet reviewed by Ivana).
#
# Each module is switched on by a Jobs-sheet hazard column (job_column), or is always included (always: true).
# It adds one or more SWMS steps. Each step lists hazards, initial risk, controls by hierarchy, residual risk and who's responsible.
#
#   hierarchy codes: E eliminate · S substitute · I isolate · Eng engineering · A administrative · PPE
#   risk: L low · M medium · H high · X extreme   (likelihood x consequence, see swms/model.py)
#   hrcw: the WHS Regulation r 291 category this module covers (null = not a high-risk construction work category on its own)
#   competencies: credential codes (engine/schema.py) a worker doing this work should hold; scope ALL or ACT/NSW
#   review_flags: always shown to the reviewer when the module is used
#
# Controls are generic good practice drawn from the cited Codes of Practice. The reviewer must tailor them to the site.

base:
  always: true
  title: General site work
  hrcw: null
  references:
    - "Construction work Code of Practice"
    - "Hazardous manual tasks Code of Practice"
    - "Managing the work environment and facilities Code of Practice"
  ppe: ["Safety boots", "Hi-vis clothing", "Gloves suited to task", "Safety glasses", "Sun protection (hat, sunscreen) outdoors"]
  competencies:
    - {code: WHITE_CARD, scope: ALL, note: "All workers doing construction work"}
    - {code: ACT_ASB_AWARE, scope: ACT, note: "ACT: mandatory for construction workers (11084NAT)"}
    - {code: ACT_SILICA, scope: ACT, note: "ACT: declared occupations (10830NAT). Confirm the worker's occupation is declared"}
  steps:
    - id: setup
      position: first
      step: "Arrive, sign in, site induction, set up work area"
      hazards: ["Unfamiliar site hazards", "Public / occupants entering the work area", "Slips, trips and falls on uneven ground"]
      risk: M
      controls:
        - [A, "Complete principal contractor / client site induction and sign in"]
        - [A, "Review this SWMS with all workers before starting. Workers sign the sign-on sheet"]
        - [I, "Barricade or tape off the work area; keep occupants and public out"]
        - [A, "Check access routes; keep work area tidy and remove trip hazards"]
      residual: L
      responsible: supervisor
    - id: manual_handling
      position: any
      step: "Handle pipes, fittings, tools and materials"
      hazards: ["Strain or sprain from lifting, carrying or awkward postures", "Crush or pinch injuries"]
      risk: M
      controls:
        - [Eng, "Use trolleys, pipe racks and mechanical aids for heavy or long items"]
        - [A, "Team lift items over about 20 kg or awkward loads. Plan the route first"]
        - [A, "Rotate tasks for sustained kneeling or overhead work"]
        - [PPE, "Gloves; knee pads for kneeling work"]
      residual: L
      responsible: all
    - id: power_tools
      position: any
      step: "Use power and hand tools (cutting, drilling, threading)"
      hazards: ["Cuts and lacerations", "Flying particles", "Electric shock from damaged leads", "Noise"]
      risk: M
      controls:
        - [Eng, "Use battery tools where practicable; guards fitted and working"]
        - [Eng, "Portable RCD on all plug-in equipment"]
        - [A, "Tools and leads tested and tagged (3-monthly on construction sites, AS/NZS 3012). Visual check before use"]
        - [PPE, "Safety glasses; hearing protection when noise is high (e.g. cutting, core drilling)"]
      residual: L
      responsible: all
    - id: chemicals
      position: any
      step: "Use hazardous chemicals (solvent cement and primer, sealants, drain cleaners, LPG)"
      hazards: ["Inhalation of vapours", "Skin and eye contact", "Fire from flammable products"]
      risk: M
      controls:
        - [S, "Choose lower-hazard products where available"]
        - [A, "Current SDS available on site. Follow SDS handling and first aid instructions"]
        - [Eng, "Use in ventilated areas; keep containers closed"]
        - [A, "No ignition sources near flammable products"]
        - [PPE, "Chemical-resistant gloves and eye protection as per SDS"]
      residual: L
      responsible: all
    - id: cleanup
      position: last
      step: "Clean up, test, hand over"
      hazards: ["Waste and sharp offcuts", "Unsecured openings or excavations left behind"]
      risk: L
      controls:
        - [A, "Remove waste; dispose of offcuts and chemical containers correctly"]
        - [A, "Leave no open excavation, pit or roof penetration unprotected"]
        - [A, "Report incidents and near misses to the supervisor the same day"]
      residual: L
      responsible: supervisor

trench:
  job_column: "Hazard: trench over 1.5m"
  title: Excavation and trenching
  hrcw: "Work in or near a trench or shaft with an excavated depth greater than 1.5 m"
  references: ["Excavation work Code of Practice", "WHS Regulation r 304-306 (excavation work)"]
  ppe: ["Hard hat"]
  plant_hint: "Excavator / mini-excavator, trench shields, compactor"
  competencies: []
  review_flags:
    - "Confirm Before You Dig Australia plans have been obtained and services located (potholing near services)."
    - "Confirm the trench support method (shoring, benching or battering) suits the ground conditions. Get geotechnical advice if unsure."
  steps:
    - id: services
      position: early
      step: "Locate underground services before digging"
      hazards: ["Striking gas, electrical, water, sewer or telecommunications services"]
      risk: H
      controls:
        - [A, "Obtain Before You Dig Australia plans; keep them on site"]
        - [A, "Mark out services; pothole by hand or vacuum excavation near them"]
        - [A, "Stop work and notify the asset owner if an unidentified service is found"]
      residual: L
      responsible: supervisor
    - id: excavate
      position: middle
      step: "Excavate trench deeper than 1.5 m"
      hazards: ["Trench collapse / engulfment", "Falls into the excavation", "Struck by excavator", "Undermining nearby structures"]
      risk: X
      controls:
        - [E, "Use trenchless methods (e.g. pipe bursting, directional boring) where practicable"]
        - [Eng, "Support the trench with shoring or a trench shield, or bench or batter the sides to a safe angle, before anyone enters"]
        - [Eng, "Keep spoil, materials and plant at least 1 m back from the edge (more for deep trenches or poor ground)"]
        - [I, "Barricade or cover the excavation when unattended"]
        - [A, "Exclusion zone around the operating excavator; spotter when workers are nearby"]
        - [A, "Safe access and egress (ladder) within the supported area"]
        - [A, "Competent person inspects the excavation daily and after rain"]
        - [PPE, "Hard hat, hi-vis"]
      residual: M
      responsible: supervisor
    - id: pipelay
      position: middle
      step: "Lay, joint and test pipework in the trench"
      hazards: ["Working in a trench", "Pressure test failure"]
      risk: H
      controls:
        - [Eng, "Work only within the supported section"]
        - [A, "No one in the trench during backfill or while plant moves nearby"]
        - [A, "Follow test procedure; clear the area during pressure testing"]
      residual: M
      responsible: licensed

height:
  job_column: "Hazard: height over 2m"
  title: Work at height
  hrcw: "Work where there is a risk of a person falling more than 2 m"
  references: ["Managing the risk of falls at workplaces Code of Practice", "WHS Regulation Part 4.4 (r 78-80)"]
  ppe: ["Harness and lanyard where a fall-arrest system is used", "Hard hat"]
  plant_hint: "Scaffold, EWP, ladders"
  competencies:
    - {code: WORK_AT_HEIGHTS, scope: ALL, note: "Commonly required by head contractors (not a licence)"}
  review_flags:
    - "Confirm which fall control is used (scaffold, edge protection, EWP or harness). If an EWP with a boom of 11 m or more is used, the operator needs HRWL class WP."
    - "Scaffolding where a person or object could fall more than 4 m must be erected by an HRWL scaffolder."
  steps:
    - id: height_work
      position: middle
      step: "Work at height (roof, gutters, stormwater, high-level pipework)"
      hazards: ["Fall from height", "Fall through brittle roofing or skylights", "Falling objects"]
      risk: X
      controls:
        - [E, "Do as much work as possible on the ground (prefabricate)"]
        - [Eng, "Use a passive fall prevention device: scaffold, edge protection, guard rails, or mesh under brittle roofing"]
        - [Eng, "Use an EWP where scaffold or edge protection isn't practicable"]
        - [Eng, "Only then use a work-positioning or fall-arrest system, with a rescue plan in place"]
        - [A, "Exclusion zone below the work; secure tools and materials"]
        - [A, "Don't work on roofs in wet or windy conditions"]
        - [PPE, "Harness inspected before use if a fall-arrest system is used; hard hat for people below"]
      residual: M
      responsible: supervisor

confined:
  job_column: "Hazard: confined space"
  title: Confined space entry
  hrcw: "Work in or near a confined space"
  references: ["Confined spaces Code of Practice", "WHS Regulation Part 4.3 (r 66-77)"]
  ppe: ["Respiratory protection as required by the risk assessment", "Personal gas detector"]
  plant_hint: "Gas detector (calibrated), forced ventilation, tripod and winch"
  competencies:
    - {code: CONFINED_SPACE, scope: ALL, note: "Workers entering, and standby persons"}
    - {code: GAS_TEST_ATMOS, scope: ALL, note: "At least one person testing the atmosphere"}
  review_flags:
    - "Confirm whether the space really is a 'confined space' under r 5 (e.g. sewer pit, tank, chamber). If it is, a confined space entry permit and risk assessment are required for each entry."
    - "Confirm the rescue arrangements. Calling 000 alone is not a rescue plan."
  steps:
    - id: cs_entry
      position: middle
      step: "Enter and work in a confined space"
      hazards: ["Oxygen-deficient or toxic atmosphere (e.g. hydrogen sulfide, methane)", "Engulfment", "Difficult rescue"]
      risk: X
      controls:
        - [E, "Do the work from outside the space where possible (e.g. CCTV, jetting from the surface)"]
        - [I, "Isolate inflows, pumps and services; lock out and tag"]
        - [Eng, "Ventilate; test the atmosphere before and continuously during entry"]
        - [A, "Written confined space entry permit for each entry (r 67); signs at the entry (r 68)"]
        - [A, "Standby person outside at all times, in contact with entrants (r 69)"]
        - [A, "Rescue and first aid procedures and equipment in place before entry (r 74)"]
        - [PPE, "Personal gas monitor; respiratory protection as assessed"]
      residual: M
      responsible: supervisor

electrical:
  job_column: "Hazard: live electrical"
  title: Work near energised electrical services
  hrcw: "Work on or near energised electrical installations or services"
  references: ["Managing electrical risks in the workplace Code of Practice", "WHS Regulation Part 4.7"]
  ppe: ["Insulated gloves only where the electrical risk assessment requires them"]
  competencies:
    - {code: ELEC_RESTRICTED, scope: ALL, note: "Only if the plumber disconnects or reconnects electrical equipment. Otherwise a licensed electrician does it"}
  review_flags:
    - "Confirm who isolates and reconnects electrical supply (licensed electrician, or a plumber with a restricted licence). Rule P-ALL-12 is pending legal review."
  steps:
    - id: elec_isolate
      position: early
      step: "Isolate electrical supply to equipment (e.g. electric hot water unit)"
      hazards: ["Electric shock or electrocution", "Arc flash"]
      risk: X
      controls:
        - [E, "Never work on energised equipment"]
        - [I, "Licensed person isolates supply at the switchboard; lock out and danger tag (personal lock per worker)"]
        - [A, "Test for dead before touching; re-test after any break"]
        - [A, "Locate cables in walls, floors and ceilings before cutting or drilling"]
      residual: L
      responsible: licensed

asbestos:
  job_column: "Hazard: asbestos"
  title: Possible asbestos
  hrcw: "Work likely to involve disturbing asbestos"
  references: ["How to manage and control asbestos in the workplace Code of Practice", "How to safely remove asbestos Code of Practice", "WHS Regulation Chapter 8"]
  ppe: ["P2 (or better) respirator, fit-tested", "Disposable coveralls (type 5/6)"]
  competencies:
    - {code: ACT_ASB_AWARE, scope: ACT, note: "Mandatory in the ACT"}
  review_flags:
    - "Confirm the asbestos register (commercial) has been sighted, or the presence of asbestos has been assumed and recorded (r 422-425)."
    - "Friable asbestos, or more than 10 m2 of non-friable asbestos, must be removed by a licensed asbestos removalist. Check the quantity and type. If over the threshold, this SWMS does NOT authorise the removal."
    - "ACT: check the affected residential premises (loose-fill) register for the address."
    - "ACT: the rules for asbestos work without a removal licence are stricter than the 10 m2 model threshold. Confirm what this worker may do (pending legal review)."
  steps:
    - id: asb_identify
      position: early
      step: "Identify asbestos before disturbing building materials (pre-2004 buildings)"
      hazards: ["Inhaling asbestos fibres from AC pipe, flues, sheeting, vinyl, mastics"]
      risk: X
      controls:
        - [A, "Check the asbestos register, ask the owner, or presume asbestos is present"]
        - [E, "Avoid disturbing suspect material; reroute pipework where possible"]
        - [A, "Stop work if suspect material is found unexpectedly; isolate the area and get it tested"]
      residual: M
      responsible: supervisor
    - id: asb_work
      position: middle
      step: "Work on small quantities of non-friable asbestos (no more than 10 m2), if unavoidable"
      hazards: ["Fibre release when cutting or breaking", "Contaminating the site and clothing"]
      risk: H
      controls:
        - [E, "No power tools, abrasives or high-pressure water on asbestos"]
        - [Eng, "Wet the material; use hand tools; shadow vacuum with an H-class vacuum"]
        - [I, "Barricade the area with signage; keep others out"]
        - [A, "Wrap waste in heavy-duty plastic, label it, and dispose of it at a licensed facility"]
        - [A, "Decontaminate tools and the area before leaving"]
        - [PPE, "Fit-tested P2 respirator; disposable coveralls"]
      residual: M
      responsible: supervisor

silica:
  job_column: "Hazard: silica"
  title: Crystalline silica dust
  hrcw: null
  references: ["Managing the risks of respirable crystalline silica from engineered stone / construction guidance (WorkSafe ACT, SafeWork NSW)", "WHS Regulation Part 7.1 (hazardous chemicals), silica provisions"]
  ppe: ["P2 respirator (fit-tested)"]
  competencies:
    - {code: ACT_SILICA, scope: ACT, note: "ACT declared occupations"}
  review_flags:
    - "Check whether this is 'high-risk crystalline silica work' under the jurisdiction's regulation (rule J-ALL-06 pending legal review)."
  steps:
    - id: silica
      position: middle
      step: "Cut, chase, core-drill or grind concrete, masonry or tiles"
      hazards: ["Breathing respirable crystalline silica dust", "Noise", "Kickback"]
      risk: H
      controls:
        - [Eng, "Wet cutting, or on-tool dust extraction with an H-class vacuum"]
        - [I, "Do the cutting outdoors or away from others where possible"]
        - [A, "No dry sweeping or compressed air for clean-up; use wet methods or an H-class vacuum"]
        - [PPE, "Fit-tested P2 respirator; hearing and eye protection"]
      residual: M
      responsible: all

hotworks:
  job_column: "Hazard: hot works"
  title: Hot works
  hrcw: null
  references: ["Welding processes Code of Practice", "AS 1674.1 Safety in welding and allied processes - fire precautions"]
  ppe: ["Heat-resistant gloves", "Eye protection suited to the process"]
  plant_hint: "Oxy-acetylene or LPG torch, fire extinguisher, fire blanket"
  competencies: []
  review_flags:
    - "Check whether the site requires a hot work permit."
  steps:
    - id: hotwork
      position: middle
      step: "Braze or solder with a flame"
      hazards: ["Fire igniting nearby combustibles", "Burns", "Gas cylinder leaks or flashback"]
      risk: H
      controls:
        - [E, "Use press-fit or other cold joining where suitable"]
        - [I, "Remove or shield combustibles; use a heat mat"]
        - [Eng, "Flashback arrestors fitted; cylinders upright and secured"]
        - [A, "Hot work permit if the site requires one; extinguisher within reach"]
        - [A, "Fire watch for at least 30 minutes after finishing (or as the permit requires)"]
        - [PPE, "Gloves and eye protection"]
      residual: L
      responsible: licensed

gas:
  job_column: "Hazard: gas lines"
  title: Work on gas lines
  hrcw: "Work on or near pressurised gas distribution mains or piping"
  references: ["AS/NZS 5601.1 Gas installations", "Managing the risks of plant / construction work Codes of Practice"]
  ppe: []
  competencies: []
  needs_licence: gas
  review_flags:
    - "Confirm gas compliance paperwork for the jurisdiction (rules J-NSW-02 and J-ACT-01 pending legal review)."
  steps:
    - id: gas_isolate
      position: early
      step: "Isolate and make safe the gas supply"
      hazards: ["Gas leak, fire or explosion", "Asphyxiation in enclosed areas"]
      risk: X
      controls:
        - [I, "Isolate at the meter or valve; lock out and tag"]
        - [A, "Purge and vent safely to outside; no ignition sources"]
        - [Eng, "Gas detector in enclosed areas"]
      residual: L
      responsible: licensed
    - id: gas_test
      position: late
      step: "Pressure test, purge and commission gas pipework and appliances"
      hazards: ["Undetected leak", "Incorrect appliance operation (carbon monoxide)"]
      risk: H
      controls:
        - [A, "Pressure test to AS/NZS 5601.1 and record results"]
        - [A, "Commission appliances to the manufacturer's instructions; check combustion and flueing"]
        - [A, "Complete the gas compliance certificate"]
      residual: L
      responsible: licensed

traffic:
  job_column: "Hazard: traffic / mobile plant"
  title: Traffic and mobile plant
  hrcw: "Work on or adjacent to a road or traffic corridor, or in an area with movement of powered mobile plant"
  references: ["Construction work Code of Practice", "Road authority traffic management requirements (TfNSW / ACT Roads)"]
  ppe: ["Hi-vis (day/night as required)"]
  competencies: []
  review_flags:
    - "Work on or next to a road needs a traffic guidance scheme or traffic management plan from the road authority's accredited provider. Confirm who supplies it."
  steps:
    - id: traffic
      position: early
      step: "Set up traffic control and plant exclusion zones"
      hazards: ["Workers struck by vehicles or mobile plant", "Public struck by plant"]
      risk: X
      controls:
        - [I, "Physical barriers separating workers from traffic and plant"]
        - [A, "Traffic guidance scheme implemented by accredited traffic controllers where required"]
        - [A, "Plant exclusion zones; spotter for reversing; eye contact with the operator before approaching"]
        - [Eng, "Plant fitted with reversing alarms and beacons"]
        - [PPE, "Hi-vis clothing"]
      residual: M
      responsible: supervisor
