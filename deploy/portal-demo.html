  --bad-50: #fef3f2; --bad-100: #fee4e2; --bad-600: #d92d20; --bad-700: #b42318;
  --info-50: #f4f3ff; --info-100: #ebe9fe; --info-700: #5925dc;
  /* roles */
  --bg: var(--n-50); --surface: var(--n-0); --surface-2: var(--n-25); --line: var(--n-200); --line-strong: var(--n-300);
  --text: var(--n-900); --text-2: var(--n-600); --text-3: var(--n-500);
  --primary: var(--b-600); --primary-hover: var(--b-700); --primary-soft: var(--b-50); --primary-text: var(--b-700);
  --focus: 0 0 0 3px rgba(47, 107, 240, .28);
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-sm: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  --shadow-md: 0 8px 20px -6px rgba(16, 24, 40, .12), 0 2px 6px -2px rgba(16, 24, 40, .06);
  --r-sm: 6px; --r: 10px; --r-lg: 14px;
  --sidebar: 264px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b111b; --surface: #121a27; --surface-2: #0f1622; --line: #223046; --line-strong: #2e3f5a;
    --text: #e8edf5; --text-2: #a9b5c7; --text-3: #8391a7;
    --n-100: #1a2434; --n-50: #151e2c;
    --primary: #4b83f5; --primary-hover: #6a99f7; --primary-soft: #16264a; --primary-text: #9dbcfb;
    --b-50: #16264a; --b-100: #1c3260; --b-200: #2a4a8c;
    --ok-50: #0f2a1e; --ok-100: #143626; --ok-600: #3ccb7f; --ok-700: #6ce0a0;
    --warn-50: #2c210c; --warn-100: #3a2b0e; --warn-600: #f5a742; --warn-700: #fbc571;
    --bad-50: #311513; --bad-100: #431a17; --bad-600: #f97066; --bad-700: #fda29b;
    --info-50: #1d1a3a; --info-100: #28244f; --info-700: #b3a6fa;
    --shadow-xs: none; --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 10px 24px -8px rgba(0, 0, 0, .6);
  }
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--font); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.011em; font-weight: 650; }
h1 { font-size: 1.6rem; letter-spacing: -.02em; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; } h4 { font-size: .8rem; }
p { margin: 0; }
a { color: var(--primary-text); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
.icon { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.muted { color: var(--text-2); } .small { font-size: .86rem; } .nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack > * + * { margin-top: 16px; }
.eyebrow { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
code { font: .82rem ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--n-100); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.plainlist { margin: 6px 0 0; padding-left: 18px; } .plainlist li { margin: 3px 0; }
.linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--primary-text); text-decoration: underline; cursor: pointer; }

/* ------------------------------------------------------------------ app shell */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--ink) var(--sidebar), transparent 0); }
.sidebar { background: var(--ink); color: var(--ink-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 14px; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 650; font-size: 1rem; letter-spacing: -.01em; padding: 4px 8px 14px; }
.brand:hover { text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(140deg, #3c7bff, #1b49c2); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.brand-mark .icon { width: 18px; height: 18px; stroke-width: 2.2; }
.brand small { display: block; font-weight: 500; font-size: .72rem; color: var(--ink-muted); letter-spacing: 0; }
.side-client { display: flex; gap: 10px; align-items: center; padding: 10px; margin: 0 0 8px; background: var(--ink-2); border: 1px solid var(--ink-line); border-radius: var(--r); }
.side-client strong { display: block; color: #fff; font-size: .9rem; font-weight: 600; line-height: 1.25; }
.side-client span { font-size: .76rem; color: var(--ink-muted); }
.side-label { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 12px 10px 4px; font-weight: 600; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-text); font-weight: 500; font-size: .92rem; }
.side-link .icon { width: 18px; height: 18px; color: var(--ink-muted); }
.side-link:hover { background: var(--ink-2); color: #fff; text-decoration: none; }
.side-link.is-active { background: #1c3257; color: #fff; }
.side-link.is-active .icon { color: #8fb4ff; }
.side-link .count { margin-left: auto; background: #2a4270; color: #dbe6ff; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 99px; }
.side-cta { margin: 10px 0 0; }
.side-foot { margin-top: auto; border-top: 1px solid var(--ink-line); padding-top: 12px; display: flex; align-items: center; gap: 10px; }
.side-foot .who { min-width: 0; flex: 1; }
.side-foot .who strong { display: block; color: #fff; font-size: .86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot .who span { font-size: .74rem; color: var(--ink-muted); }
.side-foot form { margin: 0; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-muted); cursor: pointer; }
.icon-btn:hover { background: var(--ink-2); color: #fff; }
.link-out { display: grid; place-items: center; padding: 6px 10px; border-radius: 8px; color: var(--ink-text); font-size: .8rem; border: 1px solid var(--ink-line); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.content { width: 100%; max-width: 1240px; margin: 0 auto; padding: 28px 32px 16px; flex: 1; }
.foot { max-width: 1240px; width: 100%; margin: 0 auto; padding: 8px 32px 28px; color: var(--text-3); font-size: .78rem; }
.nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
.scrim { display: none; }

@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); background: none; }
  .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff; padding: 10px 14px; }
  .topbar .brand { padding: 0; }
  .topbar .menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; color: #fff; cursor: pointer; }
  .sidebar { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: min(86vw, 300px); transform: translateX(-102%); transition: transform .2s ease; }
  .nav-toggle:checked ~ .sidebar { transform: none; box-shadow: var(--shadow-md); }
  .nav-toggle:checked ~ .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(8, 15, 28, .55); }
  .content { padding: 20px 16px 12px; }
  .foot { padding: 8px 16px 24px; }
}

/* ------------------------------------------------------------------ page header */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { color: var(--text-2); margin-top: 4px; max-width: 68ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-3); margin-bottom: 6px; }
.crumbs a { color: var(--text-2); } .crumbs .icon { width: 13px; height: 13px; }

/* ------------------------------------------------------------------ buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid transparent; font: 600 .9rem var(--font); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, box-shadow .12s; }
.btn:hover { text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-xs), inset 0 1px 0 rgba(255, 255, 255, .16); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); box-shadow: var(--shadow-xs); }
.btn-secondary:hover { background: var(--n-50); }
.btn-ghost { background: transparent; color: var(--primary-text); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-sm { height: 32px; padding: 0 11px; font-size: .82rem; border-radius: 8px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: .96rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ------------------------------------------------------------------ cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-xs); margin-bottom: 20px; }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.card-head p { margin-top: 2px; }
.card-title { display: flex; align-items: center; gap: 8px; font-size: .98rem; }
.card-pad > .card-title { margin-bottom: 12px; }
.card-foot { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); font-size: .86rem; }
.grid { display: grid; gap: 20px; margin-bottom: 20px; align-items: start; }
.grid > .card { margin-bottom: 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 900px) { .grid-2, .grid-3-2 { grid-template-columns: minmax(0, 1fr); } }
.empty { padding: 36px 20px; text-align: center; color: var(--text-2); }
.empty .icon { width: 28px; height: 28px; color: var(--n-400); display: block; margin: 0 auto 8px; }
.empty strong { display: block; color: var(--text); margin-bottom: 2px; }

/* ------------------------------------------------------------------ status hero + stats */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 24px; }
.hero h2 { font-size: 1.3rem; }
.hero p { color: var(--text-2); margin-top: 4px; }
.hero .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.hero.is-red { background: linear-gradient(100deg, var(--bad-50), var(--surface) 55%); }
.hero.is-amber { background: linear-gradient(100deg, var(--warn-50), var(--surface) 55%); }
.hero.is-green { background: linear-gradient(100deg, var(--ok-50), var(--surface) 55%); }
.donut { width: 116px; height: 116px; position: relative; flex: none; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 9; }
.donut .track { stroke: var(--n-200); }
.donut .value { stroke-linecap: round; }
.is-red .donut .value { stroke: var(--bad-600); } .is-amber .donut .value { stroke: var(--warn-500); } .is-green .donut .value { stroke: var(--ok-600); }
.donut-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-label strong { font-size: 1.55rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.donut-label span { font-size: .68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0, 1fr); } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.stats.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .stats, .stats.cols-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-xs); display: flex; gap: 12px; align-items: flex-start; }
.stat-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--n-100); color: var(--text-2); flex: none; }
.stat-icon .icon { width: 19px; height: 19px; }
.stat.is-bad .stat-icon { background: var(--bad-50); color: var(--bad-700); }
.stat.is-warn .stat-icon { background: var(--warn-50); color: var(--warn-700); }
.stat.is-ok .stat-icon { background: var(--ok-50); color: var(--ok-700); }
.stat.is-info .stat-icon { background: var(--primary-soft); color: var(--primary-text); }
.stat strong { display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--text-2); }

/* ------------------------------------------------------------------ pills, chips, avatars */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: .76rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill .icon { width: 13px; height: 13px; } .pill:has(.icon)::before { display: none; }
.pill-ok { background: var(--ok-50); color: var(--ok-700); border-color: var(--ok-100); }
.pill-warn { background: var(--warn-50); color: var(--warn-700); border-color: var(--warn-100); }
.pill-soon { background: var(--n-100); color: var(--text-2); border-color: var(--line); }
.pill-bad { background: var(--bad-50); color: var(--bad-700); border-color: var(--bad-100); }
.pill-info { background: var(--info-50); color: var(--info-700); border-color: var(--info-100); }
.pill-neutral { background: var(--n-100); color: var(--text-2); border-color: var(--line); }
.pill-neutral::before, .pill-key::before { display: none; }
.pill-key { background: var(--warn-50); color: var(--warn-700); border-color: var(--warn-100); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: .76rem; font-weight: 500; border: 1px solid var(--line); background: var(--n-50); color: var(--text-2); }
.chip .icon { width: 12px; height: 12px; }
.chip-ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-700); }
.chip-bad { background: var(--bad-50); border-color: var(--bad-100); color: var(--bad-700); }
.chip-warn { background: var(--warn-50); border-color: var(--warn-100); color: var(--warn-700); }
.chip-staff { background: var(--info-50); border-color: var(--info-100); color: var(--info-700); }
.avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--b-100); color: var(--primary-text); font-weight: 650; font-size: .8rem; flex: none; letter-spacing: 0; }
.avatar-sq { border-radius: 9px; }
.sidebar .avatar { background: #24406f; color: #dbe6ff; }

/* ------------------------------------------------------------------ alerts */
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); margin-bottom: 16px; font-size: .92rem; }
.alert[hidden] { display: none; }
.alert .icon { margin-top: 2px; width: 18px; height: 18px; }
.alert-ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-700); }
.alert-danger { background: var(--bad-50); border-color: var(--bad-100); color: var(--bad-700); }
.alert-warn { background: var(--warn-50); border-color: var(--warn-100); color: var(--warn-700); }
.alert-info { background: var(--primary-soft); border-color: var(--b-100); color: var(--primary-text); }
.alert-lg { padding: 16px 18px; }
.alert p { margin-top: 4px; }

/* ------------------------------------------------------------------ lists and tables */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }
.rows .grow { flex: 1; min-width: 0; }
.rows strong { font-weight: 600; }
.sev { width: 4px; align-self: stretch; border-radius: 4px; background: var(--n-300); flex: none; }
.sev-bad { background: var(--bad-600); } .sev-warn { background: var(--warn-500); } .sev-info { background: var(--info-700); }
.group-label { padding: 9px 20px; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); display: flex; justify-content: space-between; }
.group-label:first-child { border-top: 0; border-radius: 0; }
.rows + .group-label { margin-top: 0; }
.group-label + .rows > li:first-child { border-top: 0; }

.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 10px 20px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 13px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table .right { text-align: right; }
.table td.num { font-variant-numeric: tabular-nums; }
.cell-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell-main strong { display: block; font-weight: 600; }
.cell-main span { color: var(--text-2); font-size: .82rem; }
@media (max-width: 720px) {
  .table thead { display: none; }
  .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
  .table tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .table tbody tr:last-child { border-bottom: 0; }
  .table td { border: 0; padding: 4px 16px; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  .table td[data-label]::before { content: attr(data-label); color: var(--text-3); font-size: .78rem; text-align: left; flex: 0 0 40%; }
  .table td:first-child { text-align: left; }
  .table td:first-child::before { display: none; }
  .rows > li { padding: 12px 16px; flex-wrap: wrap; }
}
.deflist { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; margin: 0; font-size: .92rem; }
.deflist dt { color: var(--text-3); } .deflist dd { margin: 0; font-weight: 500; }
@media (max-width: 560px) { .deflist { grid-template-columns: minmax(0, 1fr); gap: 2px; } .deflist dd { margin-bottom: 8px; } }

/* ------------------------------------------------------------------ forms */
.field { display: block; min-width: 0; }
.field-label { display: block; font-size: .86rem; font-weight: 600; margin-bottom: 6px; }
.field-hint { display: block; font-size: .8rem; color: var(--text-3); margin-top: 6px; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .field-row { grid-template-columns: minmax(0, 1fr); } }
.input, select.input { display: block; width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; box-shadow: var(--shadow-xs); }
.input::placeholder { color: var(--n-400); }
.input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus); }
textarea.input { resize: vertical; }
.checkline { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.checkline input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--primary); }
.checkline-strong { padding: 12px 14px; background: var(--primary-soft); border: 1px solid var(--b-100); border-radius: var(--r); font-weight: 500; }
.segmented { display: inline-flex; flex-wrap: wrap; background: var(--n-100); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.segmented-item { border: 0; background: transparent; color: var(--text-2); font: 600 .86rem var(--font); padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.segmented-item:hover { color: var(--text); }
.segmented-item.is-on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.segmented-sm .segmented-item { padding: 5px 11px; font-size: .8rem; }
.segmented-item.is-on.is-yes { background: var(--ok-600); color: #fff; }
.segmented-item.is-on.is-no { background: var(--bad-600); color: #fff; }
.segmented-item.is-on.is-unsure { background: var(--warn-500); color: #fff; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--n-400); }
.search .input { padding-left: 36px; }
.dropzone { display: grid; place-items: center; gap: 6px; text-align: center; padding: 32px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2); cursor: pointer; transition: border-color .12s, background .12s; }
.dropzone:hover, .dropzone.is-over { border-color: var(--primary); background: var(--primary-soft); }
.dropzone .icon { width: 28px; height: 28px; color: var(--primary); }
.dropzone strong { font-weight: 600; }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filelist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.filelist li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; background: var(--surface); }
.filelist .size { margin-left: auto; color: var(--text-3); font-size: .8rem; }

/* ------------------------------------------------------------------ people */
details.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 12px; box-shadow: var(--shadow-xs); overflow: hidden; }
details.person[hidden] { display: none; }
details.person > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; }
details.person > summary::-webkit-details-marker { display: none; }
details.person > summary:hover { background: var(--surface-2); }
details.person .grow { flex: 1; min-width: 0; }
details.person .grow strong { display: block; font-weight: 600; }
details.person .grow span { color: var(--text-2); font-size: .84rem; }
details.person .chev { color: var(--n-400); transition: transform .15s; }
details.person[open] .chev { transform: rotate(180deg); }
details.person[open] > summary { border-bottom: 1px solid var(--line); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
@media (max-width: 640px) { details.person > summary { flex-wrap: wrap; padding: 12px 16px; } details.person .meta { width: 100%; padding-left: 50px; } }

/* ------------------------------------------------------------------ jobs */
.job { padding: 18px 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.job:first-child { border-top: 0; }
.job h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.job .id { font: 600 .76rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-3); background: var(--n-100); padding: 2px 7px; border-radius: 5px; }
.job p { color: var(--text-2); font-size: .9rem; margin-top: 2px; }
.job .facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; color: var(--text-2); }
.job .facts span { display: inline-flex; gap: 6px; align-items: center; }
.job .side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.track { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.track li { font-size: .74rem; font-weight: 600; color: var(--text-3); padding-top: 8px; border-top: 3px solid var(--n-200); }
.track li.is-done { border-color: var(--ok-600); color: var(--ok-700); }
.track li.is-current { border-color: var(--primary); color: var(--primary-text); }
.staffbar { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px dashed var(--info-100); background: var(--info-50); border-radius: var(--r); font-size: .82rem; }
.staffbar form { display: flex; gap: 8px; align-items: center; margin: 0; flex-wrap: wrap; }
.staffbar .lead { font-weight: 600; color: var(--info-700); margin-right: 4px; }
@media (max-width: 640px) { .job { grid-template-columns: minmax(0, 1fr); } .job .side { align-items: flex-start; } }

/* ------------------------------------------------------------------ rag + bars */
.rag { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 650; letter-spacing: .03em; padding: 3px 9px; border-radius: 6px; }
.rag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.rag-red { background: var(--bad-50); color: var(--bad-700); } .rag-amber { background: var(--warn-50); color: var(--warn-700); } .rag-green { background: var(--ok-50); color: var(--ok-700); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--n-400); flex: none; }
.dot-red { background: #f97066; } .dot-amber { background: #fdb022; } .dot-green { background: #32d583; }
.bar { width: 120px; height: 8px; border-radius: 99px; display: block; overflow: hidden; background: var(--n-200); }
.bar rect.ok { fill: var(--ok-600); } .bar rect.warn { fill: var(--warn-500); } .bar rect.bad { fill: var(--bad-600); }

/* ------------------------------------------------------------------ auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.auth-brand { background: radial-gradient(1200px 600px at -10% -20%, #1d3f86 0%, transparent 60%), var(--ink); color: #dbe6ff; padding: 48px 56px; display: flex; flex-direction: column; }
.auth-brand .brand { padding: 0; font-size: 1.05rem; }

.auth-brand p { color: #b3c3dc; margin-top: 14px; max-width: 46ch; font-size: 1rem; }
.auth-points { list-style: none; padding: 0; margin: 28px 0 auto; display: grid; gap: 14px; }
.auth-points li { display: flex; gap: 12px; align-items: flex-start; color: #dbe6ff; }
.auth-points .icon { color: #7fb0ff; margin-top: 3px; }
.auth-foot { font-size: .78rem; color: var(--ink-muted); margin-top: 32px; }
.auth-form { display: grid; place-items: center; padding: 32px 24px; background: var(--surface); }
.auth-form .inner { width: 100%; max-width: 380px; }
.auth-form h2 { font-size: 1.5rem; letter-spacing: -.02em; }
.auth-form form { margin-top: 24px; display: grid; gap: 16px; }
@media (max-width: 860px) { .auth { grid-template-columns: minmax(0, 1fr); } .auth-brand { padding: 28px 24px; } .auth-brand h1 { margin-top: 28px; font-size: 1.6rem; } .auth-points { margin-bottom: 8px; } }
.choice-cards { display: grid; gap: 12px; margin-top: 24px; }
.choice-card { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); color: var(--text); background: var(--surface); box-shadow: var(--shadow-xs); }
.choice-card:hover { border-color: var(--primary); text-decoration: none; box-shadow: var(--shadow-sm); }
.choice-card strong { display: block; } .choice-card span { color: var(--text-2); font-size: .88rem; }
.choice-card > .icon:last-child { margin-left: auto; color: var(--n-400); }
.demobar { background: #fff4cc; color: #5c4400; text-align: center; font-size: .8rem; padding: 6px 12px; font-weight: 500; }
.demobar a { color: inherit; font-weight: 700; text-decoration: underline; }

/* ------------------------------------------------------------------ guided assessment */
.wz { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.wz-steps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; list-style: none; margin: 0 0 4px; padding: 0; counter-reset: s; }
.wz-step-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px 0 0; border: 0; border-top: 3px solid var(--n-200); background: none; font: 600 .8rem var(--font); color: var(--text-3); text-align: left; }
button.wz-step-btn { cursor: pointer; }
.wz-step-dot { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--n-200); color: var(--text-2); font-size: .72rem; flex: none; }
.wz-step-dot .icon { width: 12px; height: 12px; stroke-width: 3; }
.wz-step.is-done .wz-step-btn { border-color: var(--ok-600); color: var(--text-2); }
.wz-step.is-done .wz-step-dot { background: var(--ok-600); color: #fff; }
.wz-step.is-current .wz-step-btn { border-color: var(--primary); color: var(--text); }
.wz-step.is-current .wz-step-dot { background: var(--primary); color: #fff; }
.wz-head { margin-bottom: 16px; } .wz-head h2 { font-size: 1.35rem; letter-spacing: -.02em; } .wz-head p { margin-top: 4px; }
.wz-head h2:focus { outline: none; box-shadow: none; }
.wz-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.wz-types { display: grid; gap: 12px; }
.wz-type { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; text-align: left; padding: 18px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; box-shadow: var(--shadow-xs); transition: border-color .12s, box-shadow .12s, transform .12s; }
.wz-type:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.wz-type.is-selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.wz-type-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-text); flex: none; }
.wz-type-icon .icon { width: 22px; height: 22px; }
.wz-type-body strong { display: block; font-size: 1rem; font-weight: 600; }
.wz-type-body span { color: var(--text-2); font-size: .88rem; }
.wz-type-time { font-size: .78rem; color: var(--text-3); white-space: nowrap; }
.wz-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: .82rem; color: var(--text-2); }
.wz-progress progress { flex: 0 0 180px; height: 6px; border: 0; border-radius: 99px; overflow: hidden; background: var(--n-200); appearance: none; -webkit-appearance: none; }
.wz-progress progress::-webkit-progress-bar { background: var(--n-200); }
.wz-progress progress::-webkit-progress-value { background: var(--primary); border-radius: 99px; }
.wz-progress progress::-moz-progress-bar { background: var(--primary); border-radius: 99px; }
.wz-flow { display: grid; gap: 8px; }
.wz-section { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-top: 10px; }
.wz-section:first-child { margin-top: 0; }
.wz-answered { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 12px; align-items: center; padding: 10px 14px 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: .9rem; }
.card > .wz-answered { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 12px 20px; }
.wz-answered-mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ok-50); color: var(--ok-700); }
.wz-answered-mark .icon { width: 13px; height: 13px; stroke-width: 2.6; }
.wz-answered.is-unsure .wz-answered-mark, .wz-answered.is-flagged .wz-answered-mark { background: var(--warn-50); color: var(--warn-700); }
.wz-answered-q { color: var(--text-2); }
.wz-answered.is-key .wz-answered-q { color: var(--text); font-weight: 600; }
.wz-answered-a { font-weight: 600; }
@media (max-width: 640px) { .wz-answered { grid-template-columns: auto minmax(0, 1fr) auto; } .wz-answered-a { grid-column: 2 / 3; grid-row: 2; } .wz-answered .btn { grid-row: 1 / 3; grid-column: 3; } }
.wz-question { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow-md); animation: rise .18s ease-out; }
.wz-question.is-key { border-color: var(--warn-500); box-shadow: 0 0 0 1px var(--warn-500), var(--shadow-md); }
.wz-question-meta { margin-bottom: 10px; }
.wz-question-text { font-size: 1.2rem; letter-spacing: -.015em; line-height: 1.3; }
.wz-why { display: flex; gap: 10px; margin-top: 10px; padding: 11px 13px; background: var(--warn-50); border: 1px solid var(--warn-100); border-radius: var(--r); color: var(--warn-700); font-size: .9rem; }
.wz-why .icon { margin-top: 3px; }
.wz-options { display: grid; gap: 8px; margin-top: 16px; }
.wz-options.is-row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.wz-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 11px 14px; text-align: left; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--text); font: 500 .95rem var(--font); cursor: pointer; transition: border-color .1s, background .1s; }
.wz-option:hover { border-color: var(--primary); background: var(--primary-soft); }
.wz-option.is-on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
.wz-option.is-unsure { border-style: dashed; color: var(--text-2); }
.wz-option.is-multi { justify-content: flex-start; }
.wz-option-label small { display: block; font-weight: 400; font-size: .8rem; color: var(--text-3); }
.wz-option-box { display: grid; place-items: center; width: 20px; height: 20px; border: 1.5px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: transparent; flex: none; }
.wz-option-box .icon { width: 13px; height: 13px; stroke-width: 3; }
.is-on > .wz-option-box { background: var(--primary); border-color: var(--primary); color: #fff; }
.wz-question-actions { margin-top: 16px; display: flex; justify-content: flex-end; }
.wz-complete { display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin-top: 12px; border-radius: var(--r); background: var(--ok-50); border: 1px solid var(--ok-100); color: var(--ok-700); }
.wz-complete .icon { width: 22px; height: 22px; }
.wz-quick { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--line); font-size: .92rem; }
@media (max-width: 640px) { .wz-quick { flex-direction: column; align-items: flex-start; gap: 8px; } }
.wz-people { display: grid; gap: 8px; margin-bottom: 14px; }
.wz-person { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
.wz-person:hover { border-color: var(--primary); }
.wz-person.is-on { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
.wz-person .wz-option-box { margin-top: 8px; }
.wz-person-body { min-width: 0; display: grid; gap: 2px; }
.wz-person-body .muted { font-size: .82rem; }
.wz-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.wz-team { display: grid; gap: 6px; }
.wz-team-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 12px; border-radius: var(--r); font-size: .9rem; border: 1px solid var(--line); }
.wz-team-row.is-ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-700); }
.wz-team-row.is-bad { background: var(--bad-50); border-color: var(--bad-100); color: var(--bad-700); }
.wz-team-row.is-wait { color: var(--text-2); }
.wz-team-label { font-weight: 600; } .wz-team-who { text-align: right; font-size: .84rem; }
.wz-keycard { border-color: var(--warn-500); box-shadow: 0 0 0 1px var(--warn-500); }
.wz-keycard .card-title .icon { color: var(--warn-600); }
.wz-more > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; cursor: pointer; font-weight: 600; }
.wz-more > summary::-webkit-details-marker { display: none; }
.wz-more[open] > summary .icon { transform: rotate(180deg); }
.wz-side { position: sticky; top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-xs); overflow: hidden; }
.profile-head { display: flex; gap: 12px; align-items: center; padding: 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.profile-head strong { display: block; line-height: 1.25; }
.profile-empty { padding: 28px 20px; text-align: center; }
.profile-empty .icon { width: 28px; height: 28px; color: var(--n-400); display: block; margin: 0 auto 8px; }
.profile-empty p { margin-top: 4px; font-size: .88rem; }
.profile-block { padding: 14px 16px; border-top: 1px solid var(--line); }
.profile-block:first-of-type { border-top: 0; }
.profile-block h4 { text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; color: var(--text-3); margin-bottom: 8px; }
.profile-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: .86rem; }
.profile-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; line-height: 1.4; }
.profile-list .icon { width: 15px; height: 15px; margin-top: 2px; }
.profile-list.is-risk .icon { color: var(--warn-600); } .profile-list.is-cover .icon { color: var(--ok-600); }
.profile-list.is-todo .icon { color: var(--warn-600); } .profile-list.is-need .icon { color: var(--text-3); } .profile-list.is-stop { color: var(--bad-700); }
.profile-list li.is-new { animation: flash 1.4s ease-out; border-radius: 6px; }
.profile-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: .82rem; color: var(--text-2); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes flash { from { background: var(--warn-100); box-shadow: 0 0 0 4px var(--warn-100); } to { background: transparent; box-shadow: 0 0 0 4px transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) { .wz { grid-template-columns: minmax(0, 1fr); } .wz-side { position: static; } }
@media (max-width: 720px) { .wz-steps { display: flex; gap: 6px; } .wz-step { flex: 1 1 0; min-width: 0; } .wz-step.is-current { flex: 0 0 auto; } .wz-step-label { display: none; } .wz-step.is-current .wz-step-label { display: inline; white-space: nowrap; } .wz-type { grid-template-columns: auto minmax(0, 1fr); } .wz-type-time { grid-column: 2; } .wz-team-row { grid-template-columns: auto minmax(0, 1fr); } .wz-team-who { grid-column: 2; text-align: left; } }

k\": \"The crew will be talked through the SWMS before starting, and will sign it\", \"effects\": [{\"check\": \"Crew briefing on the SWMS not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_toolbox\", \"no_flag\": \"Crew briefing on the SWMS not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"SWMS briefing\", \"type\": \"choice\"}, {\"ask\": \"Boots, hi-vis, gloves, eye and hearing protection are available for everyone\", \"effects\": [{\"check\": \"Standard PPE not confirmed as available.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ppe\", \"no_flag\": \"Standard PPE not confirmed as available.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Standard PPE\", \"type\": \"choice\"}, {\"ask\": \"A stocked first aid kit is on site or in the vehicle\", \"effects\": [{\"check\": \"First aid kit not confirmed on site.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_firstaid\", \"no_flag\": \"First aid kit not confirmed on site.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"First aid kit\", \"type\": \"choice\"}, {\"ask\": \"Power tools and leads have been tested and tagged in the last 3 months\", \"effects\": [{\"check\": \"Test and tag of tools and leads not confirmed as current.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_tag\", \"no_flag\": \"Test and tag of tools and leads not confirmed as current.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Test and tag\", \"type\": \"choice\"}, {\"ask\": \"A portable safety switch (RCD) is used for plug-in tools\", \"effects\": [{\"check\": \"Portable RCD use not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_rcd\", \"no_flag\": \"Portable RCD use not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Safety switch\", \"type\": \"choice\"}, {\"ask\": \"Safety data sheets are on hand for the glues, primers and gases you\\u0027ll use\", \"effects\": [{\"check\": \"Safety data sheets not confirmed as available on site.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_sds\", \"no_flag\": \"Safety data sheets not confirmed as available on site.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Safety data sheets\", \"type\": \"choice\"}, {\"ask\": \"A fire extinguisher will be within reach of the hot work\", \"effects\": [{\"check\": \"Fire extinguisher for hot work not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ext\", \"no_flag\": \"Fire extinguisher for hot work not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Fire extinguisher\", \"type\": \"choice\", \"when\": {\"in\": [\"yes\"], \"q\": \"hot_any\"}}, {\"ask\": \"Fit-tested P2 respirators are available for everyone exposed to dust\", \"effects\": [{\"check\": \"Fit-tested P2 respirators not confirmed for dust or asbestos work.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_rpe\", \"no_flag\": \"Fit-tested P2 respirators not confirmed for dust or asbestos work.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Fit-tested respirators\", \"type\": \"choice\", \"when\": {\"any\": [{\"in\": [\"yes\"], \"q\": \"sil_cut\"}, {\"in\": [\"present\", \"assume\", \"unknown\"], \"q\": \"asb_known\"}]}}, {\"ask\": \"A ladder or other safe way in and out of the trench will be on site\", \"effects\": [{\"check\": \"Safe access into the trench not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ladder\", \"no_flag\": \"Safe access into the trench not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Trench access\", \"type\": \"choice\", \"when\": {\"all\": [{\"in\": [\"1to15\", \"gt15\", \"unsure\"], \"q\": \"exc_depth\"}, {\"not\": {\"in\": [\"noentry\"], \"q\": \"exc_support\"}}]}}, {\"ask\": \"The machine gets a recorded pre-start check each day\", \"effects\": [{\"check\": \"Daily plant pre-start check not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_prestart\", \"no_flag\": \"Daily plant pre-start check not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Plant pre-start\", \"type\": \"choice\", \"when\": {\"in\": [\"machine\"], \"q\": \"exc_method\"}}], \"section_titles\": {\"cutting\": \"Cutting and drilling\", \"excavation\": \"Digging and trenching\", \"gas\": \"The gas work\", \"general\": \"Where the work is\", \"heights\": \"Working at height\", \"hot_water\": \"The hot water unit\", \"hotworks\": \"Hot works\", \"materials\": \"Existing building materials\", \"roof\": \"The roof\", \"sewer\": \"Live sewer and enclosed spaces\", \"surroundings\": \"Around the work area\"}}, \"states\": [\"ACT\", \"NSW\"], \"today\": \"2026-11-24\"}<\/script>\n\n\n\n    <\/main>\n    <footer class=\"foot\">\n      Register last updated 24 Nov 2026, 10:07 AM. \n      Prepared from the records you've given us. This is a compliance administration service, not le n<\/div>\n<div class=\"grid grid-3-2\">\n  <form method=\"get\" class=\"card card-pad stack\" action=\"/demo-not-saved/\">\n    \n    <input type=\"hidden\" name=\"ref\" value=\"\">\n    <label class=\"dropzone\" data-dropzone>\n      <svg class=\"icon \" aria-hidden=\"true\"><use href=\"#i-upload\"/><\/svg>\n      <strong>Choose files or drop them here<\/strong>\n      <span class=\"muted small\">PDF, photo, Word or Excel. Up to 25 MB each.<\/span>\n      <input type=\"file\" name=\"files\" multiple required accept=\".doc,.docx,.heic,.heif,.jpeg,.jpg,.pdf,.png,.xls,.xlsx,image/*\">\n    <\/label>\n    <ul class=\"filelist\" data-filelist hidden><\/ul>\n    <div class=\"field-row\">\n      <label class=\"field\"><span class=\"field-label\">What is it?<\/span><select class=\"input\" name=\"doc_type\"><option>Licence or ticket<\/option><option>White Card<\/option><option>Training certificate (e.g. asbestos, silica, first aid)<\/option><option>Insurance certificate of currency<\/option><option>Subcontractor statement<\/option><option>Safety data sheet (SDS)<\/option><option>Test and tag / service record<\/option><option>Incident or near miss<\/option><option>Policy or procedure<\/option><option>Other<\/option><\/select><\/label>\n      <label class=\"field\"><span class=\"field-label\">Who or what is it for?<\/span><input class=\"input\" name=\"about\" value=\"\" placeholder=\"For example: Sam Smith, or the jetter\"><\/label>\n    <\/div>\n    <div><button class=\"btn btn-primary\"><svg class=\"icon \" aria-hidden=\"true\"><use href=\"#i-upload\"/><\/svg>Upload<\/button><\/div>\n  <\/form>\n  <aside class=\"card card-pad\">\n    <h2 class=\"card-title\"><svg class=\"icon \" aria-hidden=\"true\"><use href=\"#i-info\"/><\/svg>A good photo<\/h2>\n    <ul class=\"plainlist muted\">\n      <li>The whole card or page is in frame<\/li>\n      <li>Name, number and expiry date are readable<\/li>\n      <li>Both sides of a card if there's writing on the back<\/li>\n      <li>For  not a confined space (restricted entry, risk of unsafe atmosphere). If it is, the confined space module is needed.\", \"control\": {\"h\": \"A\", \"step\": \"setup\", \"text\": \"Under-floor work: check ventilation, lighting and a clear way out before entering; a second person stays in contact\"}, \"if\": [\"underfloor\"]}, {\"control\": {\"h\": \"A\", \"step\": \"setup\", \"text\": \"Ceiling space: walk only on joists or crawl boards; treat all cables as live; avoid the space in extreme heat\"}, \"if\": [\"ceiling\"]}, {\"check\": \"Plant room or riser: confirm the building manager\\u0027s isolation and permit requirements.\", \"if\": [\"plant\"]}], \"id\": \"gen_where\", \"options\": [{\"label\": \"Kitchen, bathroom or laundry\", \"v\": \"wet\"}, {\"label\": \"Under the floor or in a crawl space\", \"v\": \"underfloor\"}, {\"label\": \"Ceiling or roof space\", \"v\": \"ceiling\"}, {\"label\": \"On the roof\", \"v\": \"roof\"}, {\"label\": \"Outside at ground level\", \"v\": \"outside\"}, {\"label\": \"Plant room, riser or commercial services area\", \"v\": \"plant\"}], \"priority\": \"key\", \"section\": \"general\", \"short\": \"Where the work is\", \"type\": \"multi\", \"why\": \"The location decides most of the risk. Roof and ceiling spaces bring falls and hidden cables; under-floor and plant areas bring cramped access.\"}, {\"ask\": \"Does the job touch gas pipework or a gas appliance?\", \"effects\": [{\"hazard\": \"gas\", \"if\": [\"yes\"], \"licence\": \"gas\"}], \"id\": \"gen_gas\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}], \"priority\": \"key\", \"section\": \"general\", \"short\": \"Gas work involved\", \"type\": \"choice\", \"why\": \"Gas work needs a gasfitting licence and its own isolation and testing steps.\"}, {\"ask\": \"Will anything electrical be disconnected or reconnected (for example a hot water unit, pump or appliance)?\", \"effects\": [{\"hazard\": \"electrical\", \"if\": [\"electrician\", \"restricted\", \"unsure\"]}, {\"if\": [\"restricted\"], \"need\": {\"code\": \"ELEC_RESTRICTED\", \"who\": \"any\"}}, {\"blocker\": \"Electrical disconnection and reconnection: who will do it has not been arranged.\", \"if\": [\"unsure\"]}], \"id\": \"gen_elec\", \"options\": [{\"label\": \"No electrical work\", \"v\": \"none\"}, {\"label\": \"Yes, a licensed electrician will do it\", \"v\": \"electrician\"}, {\"label\": \"Yes, our plumber holds a restricted electrical licence\", \"v\": \"restricted\"}, {\"label\": \"Yes, but not arranged yet\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"general\", \"short\": \"Electrical disconnection\", \"type\": \"choice\", \"why\": \"Only a licensed person can do electrical work. We need to know who.\"}, {\"ask\": \"Will you cut or drill into walls, floors or ceilings?\", \"effects\": [{\"control\": {\"h\": \"A\", \"step\": \"power_tools\", \"text\": \"Locate cables and pipes with a detector before cutting or drilling into walls, floors or ceilings\"}, \"if\": [\"yes\"]}], \"id\": \"gen_walls\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}], \"priority\": \"standard\", \"section\": \"general\", \"short\": \"Cutting into walls or floors\", \"type\": \"choice\"}, {\"ask\": \"What type of unit is going in?\", \"effects\": [{\"hazard\": \"gas\", \"if\": [\"gas_storage\", \"gas_cf\"], \"licence\": \"gas\"}], \"id\": \"hw_new\", \"options\": [{\"label\": \"Electric storage\", \"v\": \"electric\"}, {\"label\": \"Gas storage\", \"v\": \"gas_storage\"}, {\"label\": \"Gas continuous flow\", \"v\": \"gas_cf\"}, {\"label\": \"Heat pump\", \"v\": \"heatpump\"}, {\"label\": \"Solar (roof collectors)\", \"v\": \"solar\"}], \"priority\": \"key\", \"section\": \"hot_water\", \"short\": \"New unit\", \"type\": \"choice\", \"why\": \"The energy source decides which licences, isolations and tests the SWMS has to cover.\"}, {\"ask\": \"What is being removed?\", \"effects\": [{\"hazard\": \"gas\", \"if\": [\"gas\"], \"licence\": \"gas\"}], \"id\": \"hw_old\", \"options\": [{\"label\": \"Nothing, it\\u0027s a new install\", \"v\": \"none\"}, {\"label\": \"Electric unit\", \"v\": \"electric\"}, {\"label\": \"Gas unit\", \"v\": \"gas\"}, {\"label\": \"Solar unit\", \"v\": \"solar\"}], \"priority\": \"standard\", \"section\": \"hot_water\", \"short\": \"Unit being removed\", \"type\": \"choice\"}, {\"ask\": \"Who disconnects and reconnects the electrical supply?\", \"effects\": [{\"hazard\": \"electrical\", \"if\": [\"electrician\", \"restricted\", \"unsure\"]}, {\"if\": [\"restricted\"], \"need\": {\"code\": \"ELEC_RESTRICTED\", \"who\": \"any\"}}, {\"blocker\": \"Electrical disconnection and reconnection: who will do it has not been arranged.\", \"if\": [\"unsure\"]}], \"id\": \"hw_elec\", \"options\": [{\"label\": \"A licensed electrician\", \"v\": \"electrician\"}, {\"label\": \"Our plumber, who holds a restricted electrical licence\", \"v\": \"restricted\"}, {\"label\": \"Plug-in unit, no hard wiring touched\", \"v\": \"plug\"}, {\"label\": \"Not arranged yet\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"hot_water\", \"short\": \"Electrical disconnect / reconnect\", \"type\": \"choice\", \"when\": {\"any\": [{\"in\": [\"electric\", \"heatpump\", \"solar\"], \"q\": \"hw_new\"}, {\"in\": [\"electric\", \"solar\"], \"q\": \"hw_old\"}]}, \"why\": \"Electrical work on a hard-wired unit must be done by a licensed person. This is one of the most common gaps on hot water jobs.\"}, {\"ask\": \"Is it a sealed all-in-one heat pump, or a split system with refrigerant pipework to connect?\", \"effects\": [{\"hrcw\": [9], \"if\": [\"split\"], \"need\": {\"code\": \"ARCTICK_RHL\", \"who\": \"any\"}}, {\"blocker\": \"Heat pump type not confirmed (sealed or split). A split system needs a refrigerant handling licence.\", \"if\": [\"unsure\"]}], \"id\": \"hw_refrig\", \"options\": [{\"label\": \"Sealed all-in-one unit\", \"v\": \"sealed\"}, {\"label\": \"Split system, refrigerant pipework to connect\", \"tag\": \"Licence needed\", \"v\": \"split\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"hot_water\", \"short\": \"Refrigerant pipework\", \"type\": \"choice\", \"when\": {\"in\": [\"heatpump\"], \"q\": \"hw_new\"}, \"why\": \"Connecting refrigerant pipework needs a refrigerant handling licence (ARCtick).\"}, {\"ask\": \"Where is the new unit going?\", \"effects\": [], \"id\": \"hw_location\", \"options\": [{\"label\": \"Outside at ground level\", \"v\": \"ground\"}, {\"label\": \"Inside (cupboard, laundry, garage)\", \"v\": \"inside\"}, {\"label\": \"In the roof space\", \"v\": \"roofspace\"}, {\"label\": \"On the roof\", \"tag\": \"High-risk work\", \"v\": \"roof\"}], \"priority\": \"key\", \"section\": \"hot_water\", \"short\": \"Where the unit goes\", \"type\": \"choice\", \"why\": \"Roof and roof-space installs bring fall risks and heavy lifts at height, which need their own controls.\"}, {\"ask\": \"How will the units be moved in and out?\", \"effects\": [{\"control\": {\"h\": \"A\", \"step\": \"manual_handling\", \"text\": \"Units carried on stairs: stair-climbing trolley or two people minimum; empty the old unit fully first\"}, \"if\": [\"stairs\"]}, {\"check\": \"Lifting equipment in use: confirm who slings and directs the load (dogging is high risk work) and that there is a lift plan.\", \"if\": [\"lift\"], \"plant\": \"Crane or hoist\"}, {\"check\": \"How the hot water units will be moved has not been planned. Storage tanks weigh 60 to 150 kg.\", \"if\": [\"unsure\"]}], \"id\": \"hw_move\", \"options\": [{\"label\": \"Trolley on level ground\", \"v\": \"trolley\"}, {\"label\": \"Carried, including stairs or steps\", \"v\": \"stairs\"}, {\"label\": \"Crane, hoist or other lifting equipment\", \"v\": \"lift\"}, {\"label\": \"Not planned yet\", \"v\": \"unsure\"}], \"priority\": \"standard\", \"section\": \"hot_water\", \"short\": \"Moving the unit\", \"type\": \"choice\"}, {\"ask\": \"What is the gas work?\", \"effects\": [{\"hazard\": \"gas\", \"if\": [\"new\", \"alter\", \"appliance\", \"leak\"], \"licence\": \"gas\"}, {\"control\": {\"h\": \"A\", \"step\": \"gas_isolate\", \"text\": \"Leak repair: isolate supply first; ventilate; no ignition sources or electrical switching until the area is confirmed gas-free\"}, \"if\": [\"leak\"]}], \"id\": \"gas_work\", \"options\": [{\"label\": \"New pipework, not yet connected to supply\", \"v\": \"new\"}, {\"label\": \"Altering or extending existing pipework\", \"v\": \"alter\"}, {\"label\": \"Connecting or replacing an appliance\", \"v\": \"appliance\"}, {\"label\": \"Finding and repairing a leak\", \"tag\": \"Higher risk\", \"v\": \"leak\"}], \"priority\": \"key\", \"section\": \"gas\", \"short\": \"Type of gas work\", \"type\": \"choice\", \"why\": \"Leak repairs and alterations on live systems carry more risk than new, uncharged pipework.\"}, {\"ask\": \"Can the gas be fully isolated for the whole job?\", \"effects\": [{\"blocker\": \"Part of the gas system stays live during the work. A specific procedure is needed; the standard isolation steps don\\u0027t cover it.\", \"if\": [\"partial\"]}, {\"blocker\": \"Not confirmed whether the gas can be fully isolated.\", \"if\": [\"unsure\"]}], \"id\": \"gas_isolate\", \"options\": [{\"label\": \"Yes, isolated at the meter or cylinder\", \"v\": \"yes\"}, {\"label\": \"No, part of the system must stay live\", \"v\": \"partial\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"gas\", \"short\": \"Gas isolation\", \"type\": \"choice\", \"when\": {\"in\": [\"alter\", \"appliance\", \"leak\"], \"q\": \"gas_work\"}, \"why\": \"Working on charged gas pipework is a different, higher-risk task that the standard steps don\\u0027t cover.\"}, {\"ask\": \"Is any of the gas work indoors, below ground or in an enclosed space?\", \"effects\": [{\"control\": {\"h\": \"Eng\", \"step\": \"gas_isolate\", \"text\": \"Enclosed \"}, \"if\": [\"avoid\"]}, {\"check\": \"ACT: confirm the worker may disturb or remove this asbestos without a removal licence. ACT rules are stricter than the 10 m\\u00b2 model threshold (pending legal review).\", \"if\": [\"small\"], \"when\": {\"in\": [\"ACT\"], \"q\": \"state\"}}, {\"if\": [\"large\", \"friable\"], \"stop\": \"This amount or type of asbestos must be removed by a licensed asbestos removalist before the plumbing work. Our SWMS can cover your work after the area is cleared, not the removal itself.\"}, {\"blocker\": \"Amount and type of asbestos affected not known.\", \"if\": [\"unsure\"]}], \"id\": \"asb_amount\", \"options\": [{\"label\": \"None, we\\u0027ll work around it\", \"v\": \"avoid\"}, {\"hint\": \"Under 10 m\\u00b2, for example one sheet or a pipe section\", \"label\": \"A small amount of bonded material\", \"v\": \"small\"}, {\"label\": \"More than 10 m\\u00b2 of bonded material\", \"v\": \"large\"}, {\"label\": \"Crumbly, damaged or lagging-type material\", \"v\": \"friable\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"materials\", \"short\": \"Amount of asbestos affected\", \"type\": \"choice\", \"when\": {\"in\": [\"present\", \"assume\", \"unknown\"], \"q\": \"asb_known\"}, \"why\": \"Small amounts of bonded material can sometimes be handled by a trained tradesperson. Larger amounts, or anything crumbly, must go to a licensed asbestos removalist.\"}, {\"ask\": \"Will you cut, core-drill, chase or grind concrete, brick, tile or stone?\", \"effects\": [{\"hazard\": \"silica\", \"if\": [\"yes\"]}], \"id\": \"sil_cut\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}], \"priority\": \"standard\", \"section\": \"cutting\", \"short\": \"Cutting concrete or masonry\", \"type\": \"choice\"}, {\"ask\": \"How will the dust be controlled?\", \"effects\": [{\"control\": {\"h\": \"Eng\", \"step\": \"silica\", \"text\": \"Site-specific: wet cutting with continuous water feed\"}, \"if\": [\"wet\", \"both\"]}, {\"control\": {\"h\": \"Eng\", \"step\": \"silica\", \"text\": \"Site-specific: on-tool extraction connected to an H-class vacuum\"}, \"if\": [\"extract\", \"both\"], \"plant\": \"H-class vacuum\"}, {\"blocker\": \"No dust control selected for cutting concrete or masonry. Wet cutting or on-tool extraction is required.\", \"if\": [\"none\"]}], \"id\": \"sil_method\", \"options\": [{\"label\": \"Wet cutting\", \"v\": \"wet\"}, {\"label\": \"On-tool dust extraction with an H-class vacuum\", \"v\": \"extract\"}, {\"label\": \"Both\", \"v\": \"both\"}, {\"label\": \"Neither\", \"v\": \"none\"}], \"priority\": \"key\", \"section\": \"cutting\", \"short\": \"Dust control\", \"type\": \"choice\", \"when\": {\"in\": [\"yes\"], \"q\": \"sil_cut\"}, \"why\": \"Silica dust causes silicosis, which can\\u0027t be cured. Dry cutting with no dust control is not acceptable on any job.\"}, {\"ask\": \"Will you braze, weld or solder with a flame?\", \"effects\": [{\"hazard\": \"hotworks\", \"if\": [\"yes\"]}], \"id\": \"hot_any\", \"options\": [{\"label\": \"No, press-fit or other cold joints\", \"v\": \"no\"}, {\"label\": \"Yes\", \"v\": \"yes\"}], \"priority\": \"standard\", \"section\": \"hotworks\", \"short\": \"Flame or welding\", \"type\": \"choice\"}, {\"ask\": \"Is there anything that could catch near the flame, such as timber framing, insulation, wall cavities or dry grass?\", \"effects\": [{\"control\": {\"h\": \"A\", \"step\": \"hotwork\", \"text\": \"Site-specific: combustibles nearby. Heat mat behind every joint, wet down the area, extinguisher in hand, and stay on fire watch for at least 30 minutes\"}, \"if\": [\"yes\", \"unsure\"]}], \"id\": \"hot_combust\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"key\", \"section\": \"hotworks\", \"short\": \"Combustibles near the flame\", \"type\": \"choice\", \"when\": {\"in\": [\"yes\"], \"q\": \"hot_any\"}, \"why\": \"Most hot-work fires start inside a wall or roof cavity and are found after the crew has left.\"}, {\"ask\": \"Does the site require a hot work permit?\", \"effects\": [{\"control\": {\"h\": \"A\", \"step\": \"hotwork\", \"text\": \"Site-specific: hot work permit obtained from the site before starting, and closed out after the fire watch\"}, \"if\": [\"yes\"]}, {\"check\": \"Not known whether the site requires a hot work permit.\", \"if\": [\"unsure\"]}], \"id\": \"hot_permit\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"standard\", \"section\": \"hotworks\", \"short\": \"Hot work permit\", \"type\": \"choice\", \"when\": {\"in\": [\"yes\"], \"q\": \"hot_any\"}}, {\"ask\": \"Is any of the work on or beside a road, footpath or driveway that stays in use?\", \"effects\": [{\"hazard\": \"traffic\", \"if\": [\"private\", \"public\"]}], \"id\": \"sur_road\", \"options\": [{\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"A private driveway or car park\", \"v\": \"private\"}, {\"label\": \"A public road or footpath\", \"tag\": \"High-risk work\", \"v\": \"public\"}], \"priority\": \"key\", \"section\": \"surroundings\", \"short\": \"Roads and traffic\", \"type\": \"choice\", \"why\": \"Work beside live traffic needs a traffic guidance scheme from an accredited provider. It can\\u0027t be improvised with a few cones.\"}, {\"ask\": \"Who is providing the traffic management?\", \"effects\": [{\"check\": \"Head contractor provides traffic management: sight their traffic guidance scheme.\", \"if\": [\"builder\"]}, {\"blocker\": \"Work on a public road or footpath: traffic management has not been arranged.\", \"if\": [\"none\"]}], \"id\": \"sur_tgs\", \"options\": [{\"label\": \"The head contractor\", \"v\": \"builder\"}, {\"label\": \"A traffic management company we\\u0027ve engaged\", \"v\": \"provider\"}, {\"label\": \"Not arranged yet\", \"v\": \"none\"}], \"priority\": \"key\", \"section\": \"surroundings\", \"short\": \"Traffic management\", \"type\": \"choice\", \"when\": {\"in\": [\"public\"], \"q\": \"sur_road\"}, \"why\": \"Without it, the work can\\u0027t legally start, and the road authority may need notice.\"}, {\"ask\": \"Will the property be occupied or open to the public while you work?\", \"effects\": [{\"control\": {\"h\": \"I\", \"step\": \"setup\", \"text\": \"Site-specific: property occupied. Barricade the work area, keep access routes clear and tell the occupier each day what is isolated\"}, \"if\": [\"yes\"]}], \"id\": \"sur_occupied\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}], \"priority\": \"standard\", \"section\": \"surroundings\", \"short\": \"Occupied during work\", \"type\": \"choice\"}, {\"ask\": \"Everyone on the job has done, or will do, the site induction\", \"effects\": [{\"check\": \"Site induction not confirmed for all workers.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_induct\", \"no_flag\": \"Site induction not confirmed for all workers.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Site induction\", \"type\": \"choice\"}, {\"ask\": \"The crew will be talked through the SWMS before starting, and will sign it\", \"effects\": [{\"check\": \"Crew briefing on the SWMS not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_toolbox\", \"no_flag\": \"Crew briefing on the SWMS not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"SWMS briefing\", \"type\": \"choice\"}, {\"ask\": \"Boots, hi-vis, gloves, eye and hearing protection are available for everyone\", \"effects\": [{\"check\": \"Standard PPE not confirmed as available.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ppe\", \"no_flag\": \"Standard PPE not confirmed as available.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Standard PPE\", \"type\": \"choice\"}, {\"ask\": \"A stocked first aid kit is on site or in the vehicle\", \"effects\": [{\"check\": \"First aid kit not confirmed on site.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_firstaid\", \"no_flag\": \"First aid kit not confirmed on site.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"First aid kit\", \"type\": \"choice\"}, {\"ask\": \"Power tools and leads have been tested and tagged in the last 3 months\", \"effects\": [{\"check\": \"Test and tag of tools and leads not confirmed as current.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_tag\", \"no_flag\": \"Test and tag of tools and leads not confirmed as current.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Test and tag\", \"type\": \"choice\"}, {\"ask\": \"A portable safety switch (RCD) is used for plug-in tools\", \"effects\": [{\"check\": \"Portable RCD use not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_rcd\", \"no_flag\": \"Portable RCD use not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Safety switch\", \"type\": \"choice\"}, {\"ask\": \"Safety data sheets are on hand for the glues, primers and gases you\\u0027ll use\", \"effects\": [{\"check\": \"Safety data sheets not confirmed as available on site.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_sds\", \"no_flag\": \"Safety data sheets not confirmed as available on site.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Safety data sheets\", \"type\": \"choice\"}, {\"ask\": \"A fire extinguisher will be within reach of the hot work\", \"effects\": [{\"check\": \"Fire extinguisher for hot work not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ext\", \"no_flag\": \"Fire extinguisher for hot work not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Fire extinguisher\", \"type\": \"choice\", \"when\": {\"in\": [\"yes\"], \"q\": \"hot_any\"}}, {\"ask\": \"Fit-tested P2 respirators are available for everyone exposed to dust\", \"effects\": [{\"check\": \"Fit-tested P2 respirators not confirmed for dust or asbestos work.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_rpe\", \"no_flag\": \"Fit-tested P2 respirators not confirmed for dust or asbestos work.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Fit-tested respirators\", \"type\": \"choice\", \"when\": {\"any\": [{\"in\": [\"yes\"], \"q\": \"sil_cut\"}, {\"in\": [\"present\", \"assume\", \"unknown\"], \"q\": \"asb_known\"}]}}, {\"ask\": \"A ladder or other safe way in and out of the trench will be on site\", \"effects\": [{\"check\": \"Safe access into the trench not confirmed.\", \"if\": [\"no\", \"unsure\"]}], \"id\": \"q_ladder\", \"no_flag\": \"Safe access into the trench not confirmed.\", \"options\": [{\"label\": \"Yes\", \"v\": \"yes\"}, {\"label\": \"No\", \"v\": \"no\"}, {\"label\": \"Not sure\", \"v\": \"unsure\"}], \"priority\": \"quick\", \"short\": \"Trench access\", \"type\": \"choice\", \"when\": {\"all\": [{\"in\": [\"1to15\", \"gt15\", \" <script>/* Guided SWMS assessment: evaluation engine.

(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.AssessmentEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  var CONTEXT = ["job_type", "state", "building_age"];

  function vals(answers, key) {
    var v = answers[key];
    if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) return [];
    return Array.isArray(v) ? v.map(String) : [String(v)];
  }
  function cond(c, answers) {
    if (!c) return true;
    if (c.all) return c.all.every(function (x) { return cond(x, answers); });
    if (c.any) return c.any.some(function (x) { return cond(x, answers); });
    if (c.not) return !cond(c.not, answers);
    var allowed = c["in"].map(String);
    return vals(answers, c.q).some(function (v) { return allowed.indexOf(v) >= 0; });
  }
  function questionsFor(spec, jobType) {
    var jt = spec.job_types.filter(function (j) { return j.id === jobType; })[0];
    if (!jt) return [];
    var out = [];
    jt.sections.forEach(function (sec) {
      spec.questions.forEach(function (q) { if (q.section === sec) out.push(q); });
    });
    spec.questions.forEach(function (q) { if (q.priority === "quick") out.push(q); });
    return out;
  }
  function pushUnique(arr, v) {
    var key = JSON.stringify(v);
    if (!arr.some(function (x) { return JSON.stringify(x) === key; })) arr.push(v);
  }
  function evaluate(answers, spec) {
    var jt = spec.job_types.filter(function (j) { return j.id === answers.job_type; })[0];
    var res = { job_type: jt ? jt.id : null, template: jt ? jt.template : null, visible: [], missing: [], hazards: [], hrcw: [],
      controls: [], needs: [], licences: [], plant: [], blockers: [], checks: [], stops: [], details: [], quick_no: [], clean: {} };
    if (!jt) return res;
    var live = {};
    CONTEXT.forEach(function (k) { live[k] = answers[k] === undefined ? null : answers[k]; });
    questionsFor(spec, jt.id).forEach(function (q) {
      if (!cond(q.when, live)) return;
      res.visible.push(q.id);
      var allowed = q.options.map(function (o) { return o.v; });
      var v = vals(answers, q.id).filter(function (x) { return allowed.indexOf(x) >= 0; });
      if (q.type !== "multi") v = v.slice(0, 1);
      if (!v.length) { res.missing.push(q.id); return; }
      live[q.id] = q.type === "multi" ? v : v[0];
      res.clean[q.id] = live[q.id];

      if (q.priority === "quick") {

      } else {

        var hit = e["if"].map(String);

        if (e.need) pushUnique(res.needs, e.need);

        if (e.plant) pushUnique(res.plant, e.plant);

        if (e.check) pushUnique(res.checks, e.check);
        if (e.stop) pushUnique(res.stops, e.stop);
      });
    });
    return res;
  }
